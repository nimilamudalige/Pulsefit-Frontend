name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: pulsefit-capstone
  REGION: asia-south1
  SERVICE: pulsefit-frontend
  REPO: pulsefit-frontend-repo             # Artifact Registry repo name (Part 13)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # TODO: replace PROJECT_NUMBER after creating the WIF pool (Part 14)
          workload_identity_provider: projects/327356240868/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: pulsefit-deployer@pulsefit-capstone.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/frontend:${{ github.sha }}"
          BUILD_ID=$(gcloud builds submit --tag "$IMAGE" --async --format='value(id)' .)
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format='value(status)')
            echo "  status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "Build failed with status $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080
